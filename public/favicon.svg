<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B52A4"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Rounded Shield / Icon Frame -->
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#bgGrad)" filter="url(#shadow)"/>
  
  <!-- Subtle Inner Border -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="6"/>

  <!-- Psychology Symbol (Psi) & Therapy Lotus Harmony Icon -->
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
    <!-- Main Center Vertical Stem -->
    <path d="M 256,96 L 256,416" stroke-width="36" stroke="#FFFFFF"/>
    
    <!-- Outer Curved Wings / Arms of Psi -->
    <path d="M 128,160 C 128,310 200,340 256,340 C 312,340 384,310 384,160" stroke-width="34" stroke="#FFFFFF"/>
    
    <!-- Base Horizontal Support Bar -->
    <path d="M 196,416 L 316,416" stroke-width="36" stroke="#FFFFFF"/>
    
    <!-- Top Crown Accent Dot / Lotus Essence -->
    <circle cx="256" cy="96" r="18" fill="#38BDF8" stroke="#FFFFFF" stroke-width="8"/>
    <circle cx="128" cy="160" r="14" fill="#38BDF8" stroke="#FFFFFF" stroke-width="6"/>
    <circle cx="384" cy="160" r="14" fill="#38BDF8" stroke="#FFFFFF" stroke-width="6"/>
  </g>
</svg>
